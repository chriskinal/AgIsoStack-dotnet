; The AOW link gateway on an ESP32 (gateway/esp32/README.md): the ESP32's own CAN controller
; (TWAI) with a 3.3 V transceiver, its own Wi-Fi access point, the protocol from ../linux.
;
;   pio run -d gateway/esp32 -t upload --upload-port /dev/cu.usbserial-XXXX

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; aow_link.cpp is shared with aow-linkd, as it is
build_src_filter = +<*> +<../../linux/aow_link.cpp>
build_flags =
    -I../linux
    -std=gnu++17
    ; the core's own log would land in the serial replies
    -DCORE_DEBUG_LEVEL=0
build_unflags = -std=gnu++11
